name: Finite Predecessor Reservoir Capacity Lean Gate

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/EqualDepthPredecessorAntichain.lean
      - collatz_k19/FinitePredecessorReservoirCapacity.lean
      - .github/workflows/finite-predecessor-reservoir-capacity.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_METADATA_CACHE_KEY: k19-source-split-metadata-Linux-352f2f8dbecff8ed81b2cc986ee8e97c39b772e6
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned Lean project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source logs
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          cp collatz_k19/EqualDepthPredecessorAntichain.lean source/
          cp collatz_k19/FinitePredecessorReservoirCapacity.lean source/
          sha256sum \
            collatz_k19/EqualDepthPredecessorAntichain.lean \
            collatz_k19/FinitePredecessorReservoirCapacity.lean \
            | tee logs/source.sha256

      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Fetch pinned dependencies
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get

      - name: Restore pinned source build boundary
        uses: actions/cache/restore@v5
        with:
          path: source/.lake/build
          key: ${{ env.SOURCE_METADATA_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Compile antichain and finite capacity theorems
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake env lean EqualDepthPredecessorAntichain.lean \
            -o .lake/build/lib/lean/EqualDepthPredecessorAntichain.olean \
            -i .lake/build/lib/lean/EqualDepthPredecessorAntichain.ilean \
            2>&1 | tee ../logs/lean.out
          lake env lean FinitePredecessorReservoirCapacity.lean \
            -o .lake/build/lib/lean/FinitePredecessorReservoirCapacity.olean \
            -i .lake/build/lib/lean/FinitePredecessorReservoirCapacity.ilean \
            2>&1 | tee -a ../logs/lean.out
          if grep -q 'sorryAx' ../logs/lean.out; then exit 5; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              EqualDepthPredecessorAntichain.lean \
              FinitePredecessorReservoirCapacity.lean; then
            exit 6
          fi
          grep -q 'sum_predecessorCount_le_cutoff' ../logs/lean.out
          printf '%s\n' \
            'FINITE_EQUAL_DEPTH_RESERVOIRS_PAIRWISE_DISJOINT=PASS' \
            'FINITE_PREDECESSOR_COUNT_SUM_LE_CUTOFF=PASS' \
            'FINITE_TERMINAL_CAPACITY_LOAD_ONE=PASS' \
            'FORMAL_GATE=PASS' \
            | tee ../logs/verdict.out

      - name: Upload exact Lean evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finite-predecessor-reservoir-capacity-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
