name: K19 Adaptive Exact Row 00 After Metadata Closure

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/adaptive_safe_row00_trigger.env
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_STACK_SIZE_KB: 1572864
  METADATA_CACHE_KEY: k19-adaptive-stack-safe-metadata-Linux-a4a885379e2d3ef17d8f87f79d2c3e89fd577d9a
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b
  REPRODUCERS_SHA256: bb34a603feea4865a48ef26345b087f5f961ae7ace78c2acba254b071732a914
  FORMAL_TOOLS_SHA256: 53923fd035af8a5edd442bfb9dee583c0774e41de0899cc445e859fa7214e495
  WEIGHT_SHA256: 82a71c4e1ca22ea94c0d3338fbea93c8d052e659a65a2101a1643bfdda7f8d79
  POTENTIAL_SHA256: 728ed6fbe2def7f37e41b5568feefe3553a3d7c43553aee6ee5495f7ae241e39

jobs:
  row00:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact assets and pinned source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs reproducers formal_tools source
          base64 --decode collatz_k19/k19_reproducers.tar.gz.b64 > "$RUNNER_TEMP/reproducers.tar.gz"
          base64 --decode collatz_k19/k19_formal_patch_tools.tar.gz.b64 > "$RUNNER_TEMP/formal_tools.tar.gz"
          echo "$REPRODUCERS_SHA256  $RUNNER_TEMP/reproducers.tar.gz" | sha256sum --check -
          echo "$FORMAL_TOOLS_SHA256  $RUNNER_TEMP/formal_tools.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/reproducers.tar.gz" -C reproducers
          tar -xzf "$RUNNER_TEMP/formal_tools.tar.gz" -C formal_tools
          chmod +x reproducers/*.sh formal_tools/*.sh formal_tools/*.py
          WORK="$RUNNER_TEMP/k19_replay"
          /usr/bin/time -v reproducers/reproduce_all.sh "$WORK" 4 \
            2>&1 | tee logs/reconstruction.out
          echo "$WEIGHT_SHA256  $WORK/k19_gamma14551_16000.u32le" | sha256sum --check -
          echo "$POTENTIAL_SHA256  $WORK/k19_adaptive_potential.u8" | sha256sum --check -
          ARCHIVE="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$ARCHIVE"
          echo "$SOURCE_ARCHIVE_SHA256  $ARCHIVE" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C source --strip-components=1
          python3 collatz_k19/verify_pinned_source.py source | tee logs/pinned_source.out

      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Generate byte-identical split adaptive sources
        shell: bash
        run: |
          set -euxo pipefail
          cd source
          lake update
          lake exe cache get
          cd ..
          WORK="$RUNNER_TEMP/k19_replay"
          cp collatz_k19/StreamingCertificate.lean \
            source/Erdos1135/KrasikovLagarias/StreamingCertificate.lean
          cp collatz_k19/ChunkedStreamingCertificate.lean \
            source/Erdos1135/KrasikovLagarias/ChunkedStreamingCertificate.lean
          python3 formal_tools/generate_hex_artifacts.py \
            "$WORK/k19_adaptive_potential.u8" \
            source/artifacts/kl_predecessor/k19_adaptive_potential \
            --chunk-bytes 33554432 | tee logs/hex.out
          python3 collatz_k19/generate_k19_adaptive_chunked.py source --row-chunks 8 \
            | tee logs/generator.out

      - name: Restore exact compiled Metadata boundary
        uses: actions/cache/restore@v5
        with:
          path: source/.lake/build
          key: ${{ env.METADATA_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Add non-conflicting swap
        shell: bash
        run: |
          set -euxo pipefail
          sudo fallocate -l 12G /mnt/k19-row00.swap
          sudo chmod 600 /mnt/k19-row00.swap
          sudo mkswap /mnt/k19-row00.swap
          sudo swapon /mnt/k19-row00.swap
          swapon --show | tee logs/swap.out

      - name: Prove exact first adaptive interval
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          heartbeat() {
            while true; do
              echo "ADAPTIVE_ROW_00_HEARTBEAT $(date -u +%FT%TZ)"
              free -h | sed -n '1,3p'
              sleep 30
            done
          }
          heartbeat & hb=$!
          set +e
          /usr/bin/time -v timeout 10200 lake build \
            Erdos1135.KrasikovLagarias.Generated.K19AdaptiveForcedPotentialRows00 \
            2>&1 | tee ../logs/row00_build.out
          status=${PIPESTATUS[0]}
          set -e
          kill "$hb" 2>/dev/null || true
          wait "$hb" 2>/dev/null || true
          test "$status" -eq 0
          grep -q 'Build completed successfully' ../logs/row00_build.out
          GEN=.lake/build/lib/lean/Erdos1135/KrasikovLagarias/Generated
          test -s "$GEN/K19AdaptiveForcedPotentialRows00.olean"
          sha256sum "$GEN/K19AdaptiveForcedPotentialRows00.olean" \
            | tee ../logs/row00_olean.sha256
          cat > K19AdaptiveRow00AxiomAudit.lean <<'EOF'
          import Erdos1135.KrasikovLagarias.Generated.K19AdaptiveForcedPotentialRows00
          #print axioms Erdos1135.KrasikovLagarias.k19AdaptiveForcedPotentialRows00
          EOF
          lake env lean K19AdaptiveRow00AxiomAudit.lean \
            2>&1 | tee ../logs/axiom_audit.out
          if grep -q 'sorryAx' ../logs/axiom_audit.out; then exit 5; fi
          printf '%s\n' \
            'K19_ADAPTIVE_METADATA_CACHE_AUTHENTICATED=PASS' \
            'K19_ADAPTIVE_ROW_00_RANGE_START=0' \
            'K19_ADAPTIVE_ROW_00_RANGE_COUNT=48427562' \
            'K19_ADAPTIVE_ROW_00_NATIVE=PASS' \
            'K19_ADAPTIVE_ROW_00_NO_SORRYAX=PASS' \
            | tee ../logs/verdict.out

      - name: Upload exact row proof object and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k19-adaptive-row00-stack-safe-${{ github.run_id }}
          path: |
            logs/
            source/.lake/build/lib/lean/Erdos1135/KrasikovLagarias/Generated/K19AdaptiveForcedPotentialRows00.olean
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
