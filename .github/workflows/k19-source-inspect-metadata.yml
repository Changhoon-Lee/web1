name: K19 Pinned Metadata Source Inspection

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - .github/workflows/k19-source-inspect-metadata.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned source and print relevant exact definitions
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          list="$RUNNER_TEMP/list.txt"
          tar -tzf "$archive" > "$list"
          for suffix in \
            Erdos1135/KrasikovLagarias/ChunkedEncoding.lean \
            Erdos1135/KrasikovLagarias/AdaptiveForcedPotentialCertificate.lean \
            Erdos1135/KrasikovLagarias/EncodedCertificate.lean \
            Erdos1135/KrasikovLagarias/ForcedPotentialCertificate.lean; do
            member=$(grep -E "/${suffix}$|^${suffix}$" "$list" | head -n 1)
            test -n "$member"
            out="logs/$(basename "$suffix")"
            tar -xOzf "$archive" "$member" | tee "$out"
          done
      - name: Upload inspected source
        uses: actions/upload-artifact@v4
        with:
          name: k19-pinned-metadata-source-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
