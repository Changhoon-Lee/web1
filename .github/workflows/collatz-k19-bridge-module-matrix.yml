name: Collatz K19 Bridge Module Matrix

on:
  push:
    branches:
      - collatz-k19-formal-gate-20260808
    paths:
      - .github/workflows/collatz-k19-bridge-module-matrix.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b
  FORMAL_TOOLS_SHA256: 53923fd035af8a5edd442bfb9dee583c0774e41de0899cc445e859fa7214e495

jobs:
  bridge-module:
    name: ${{ matrix.short }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - short: coefficient
            target: Erdos1135.KrasikovLagarias.K19CoefficientBridge
          - short: critical-choice
            target: Erdos1135.KrasikovLagarias.K19CriticalChoice
          - short: predecessor-bridge
            target: Erdos1135.KrasikovLagarias.K19PredecessorBridge
          - short: all-targets
            target: Erdos1135.KrasikovLagarias.K19PredecessorAllTargets
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned source and overlay generator
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs source formal_tools
          base64 --decode collatz_k19/k19_formal_patch_tools.tar.gz.b64 > "$RUNNER_TEMP/formal_tools.tar.gz"
          echo "$FORMAL_TOOLS_SHA256  $RUNNER_TEMP/formal_tools.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/formal_tools.tar.gz" -C formal_tools
          chmod +x formal_tools/*.py formal_tools/*.sh collatz_k19/prepare_k19_structural_stub_tree.sh
          ARCHIVE="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$ARCHIVE"
          echo "$SOURCE_ARCHIVE_SHA256  $ARCHIVE" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C source --strip-components=1
          python3 collatz_k19/verify_pinned_source.py source | tee logs/pinned_source.out

      - name: Install pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Fetch dependencies
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get

      - name: Install explicit structural stubs and reviewed overlay
        shell: bash
        run: |
          set -euxo pipefail
          collatz_k19/prepare_k19_structural_stub_tree.sh source formal_tools \
            | tee logs/overlay.out

      - name: Compile selected K19 bridge module with heartbeat
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          heartbeat() {
            while true; do
              echo "K19_${{ matrix.short }}_HEARTBEAT $(date -u +%FT%TZ)"
              sleep 30
            done
          }
          heartbeat & hb=$!
          set +e
          /usr/bin/time -v timeout 4800 lake build '${{ matrix.target }}' \
            2>&1 | tee '../logs/${{ matrix.short }}.out'
          status=${PIPESTATUS[0]}
          set -e
          kill "$hb" 2>/dev/null || true
          wait "$hb" 2>/dev/null || true
          test "$status" -eq 0
          grep -q 'Build completed successfully' '../logs/${{ matrix.short }}.out'
          echo 'K19_BRIDGE_MODULE_${{ matrix.short }}=PASS_WITH_DECLARED_STUB_AXIOMS' \
            | tee '../logs/${{ matrix.short }}.verdict'

      - name: Upload structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k19-bridge-${{ matrix.short }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
