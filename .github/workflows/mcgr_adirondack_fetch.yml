name: MCGR Adirondack immutable source fetch

on:
  push:
    branches: [ncs-multimode-coherence-prereg-20260812]
    paths: ['.github/workflows/mcgr_adirondack_fetch.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch official Middlebury Adirondack-perfect source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          base='https://vision.middlebury.edu/stereo/data/scenes2014/datasets/Adirondack-perfect'
          for f in im0.png im1.png disp0.pfm calib.txt; do
            curl --fail --location --retry 8 --retry-all-errors --connect-timeout 30 "$base/$f" -o "source/$f"
            test -s "source/$f"
          done
          sha256sum source/im0.png source/im1.png source/disp0.pfm source/calib.txt > source/SHA256SUMS.txt
          stat -c '%n %s' source/im0.png source/im1.png source/disp0.pfm source/calib.txt > source/SIZES.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('source/disp0.pfm')
          with p.open('rb') as f:
              lines=[f.readline().decode('ascii').strip() for _ in range(3)]
          Path('source/PFM_HEADER.txt').write_text('\n'.join(lines)+'\n')
          if lines[0] not in {'Pf','PF'}:
              raise SystemExit('bad PFM magic')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: mcgr-adirondack-official-source
          path: source
          if-no-files-found: error
          retention-days: 90
