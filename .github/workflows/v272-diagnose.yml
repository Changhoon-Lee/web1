      - name: test_15_audit_suite_contains_actual_data_gates
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_15_audit_suite_contains_actual_data_gates
      - name: test_16_complete_utc_intraday_gate
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_16_complete_utc_intraday_gate
      - name: test_17_partial_day_excluded
        continue-on-error: true
