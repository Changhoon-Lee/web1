name: V27.2 Per-Test Diagnostics

on:
  push:
    branches: [v272-inverse-accounting]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-v272.txt
      - name: test_01_config_validates
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_01_config_validates
      - name: test_02_inverse_contract_pnl_identity
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_02_inverse_contract_pnl_identity
      - name: test_03_inverse_short_profit_on_price_fall
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_03_inverse_short_profit_on_price_fall
      - name: test_04_funding_sign
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_04_funding_sign
      - name: test_05_canonicalization_preserves_perpetual
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_05_canonicalization_preserves_perpetual
      - name: test_06_free_snapshot_contains_actual_perpetual_fields
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_06_free_snapshot_contains_actual_perpetual_fields
      - name: test_07_per_timestamp_symbol_count
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_07_per_timestamp_symbol_count
      - name: test_08_paid_credentials_rejected
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_08_paid_credentials_rejected
      - name: test_09_perpetual_bid_ask_changes_final_equity
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_09_perpetual_bid_ask_changes_final_equity
      - name: test_10_actual_funding_changes_final_equity
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_10_actual_funding_changes_final_equity
      - name: test_11_missing_funding_fails_continuity
        continue-on-error: true
        run: python -m unittest tests.test_v272.V272Tests.test_11_missing_funding_fails_continuity
      - name: test_12_held_state_writer
