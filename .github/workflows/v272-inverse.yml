name: V27.2 Actual Inverse Free/Open

on:
  push:
    branches: [v272-inverse-accounting]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q -r requirements-v272.txt
      - name: Run 27 authority tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python scripts/run_v272_authority_tests.py
      - name: Fail-closed smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          rm -rf data/v272_free_chain v272_results runtime
          mkdir -p data/v272_free_chain
          python src/v272_cli.py all --data data/v272_free_chain --output v272_results --handoff runtime/V272_Actual_Inverse_Handoff.zip --no-record --record-minutes 0
          python src/v272_cli.py verify --output v272_results
      - name: Stage sanitized source
        run: |
          rm -rf artifact_stage
          mkdir -p artifact_stage/src artifact_stage/tests artifact_stage/scripts
          cp src/v272_core.py src/v272_core_legacy.py src/v272_free.py src/v272_cli.py artifact_stage/src/
          cp tests/test_v272.py tests/test_v272_wrapper.py artifact_stage/tests/
          cp scripts/run_v272_authority_tests.py artifact_stage/scripts/
          cp requirements-v272.txt V272_PROTOCOL.json V272_README.md artifact_stage/
          cp RUN_V272_EVERYTHING.command INSTALL_AND_START_V272.command V272_SAFE_LAUNCHER.sh artifact_stage/
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifact_stage')
          files=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  files.append({'path':str(p.relative_to(root)), 'size':p.stat().st_size, 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          payload=json.dumps(files,sort_keys=True,separators=(',',':')).encode()
          (root/'RELEASE_INFO.json').write_text(json.dumps({'protocol':'27.2.1-inverse-actual','commit':'${{ github.sha }}','files':files,'tree_sha256':hashlib.sha256(payload).hexdigest()},indent=2)+'\n')
          forbidden=['tardis_dev','TARDIS_API_KEY=','DERIBIT_CLIENT_SECRET=','DERIBIT_CLIENT_ID=']
          text='\n'.join(p.read_text(errors='ignore') for p in root.rglob('*') if p.is_file())
          for token in forbidden:
              if token in text: raise SystemExit(f'forbidden token: {token}')
          PY
      - name: Clean-tree verification
        run: |
          cd artifact_stage
          python -m pip install -q -r requirements-v272.txt
          export PYTHONPATH="$PWD/src"
          python scripts/run_v272_authority_tests.py
          mkdir -p data/v272_free_chain
          python src/v272_cli.py all --data data/v272_free_chain --output v272_results --handoff runtime/V272_Actual_Inverse_Handoff.zip --no-record --record-minutes 0
          python src/v272_cli.py verify --output v272_results
      - name: Build deterministic ZIP
        run: |
          rm -rf artifact_stage/data artifact_stage/v272_results artifact_stage/runtime artifact_stage/.venv artifact_stage/**/__pycache__
          python - <<'PY'
          from pathlib import Path
          import zipfile,hashlib
          root=Path('artifact_stage'); out=Path('V272_Actual_Inverse_Free_Open_Final.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file(): continue
                  info=zipfile.ZipInfo(str(p.relative_to(root)))
                  info.date_time=(1980,1,1,0,0,0)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o755 if p.suffix in {'.command','.sh','.py'} else 0o644)<<16
                  z.writestr(info,p.read_bytes())
          print('sha256',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V272_Actual_Inverse_Free_Open_Final
          path: V272_Actual_Inverse_Free_Open_Final.zip
          if-no-files-found: error
          retention-days: 90
