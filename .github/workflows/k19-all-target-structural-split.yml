name: K19 All-Target Structural Split Gate

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - .github/workflows/k19-all-target-structural-split.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b
  FORMAL_TOOLS_SHA256: 53923fd035af8a5edd442bfb9dee583c0774e41de0899cc445e859fa7214e495
  STRUCTURAL_CACHE_KEY: k19-all-target-structural-base-v1

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare byte-identical structural tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs source formal_tools
          base64 --decode collatz_k19/k19_formal_patch_tools.tar.gz.b64 \
            > "$RUNNER_TEMP/formal_tools.tar.gz"
          echo "$FORMAL_TOOLS_SHA256  $RUNNER_TEMP/formal_tools.tar.gz" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/formal_tools.tar.gz" -C formal_tools
          chmod +x formal_tools/*.py collatz_k19/*.sh
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          python3 collatz_k19/verify_pinned_source.py source | tee logs/pinned_source.out
          collatz_k19/prepare_k19_structural_stub_tree.sh source formal_tools \
            | tee logs/structural_tree.out
          cat >> source/lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "CollatzPredecessorK19"

          [[lean_lib]]
          name = "K19AxiomAudit"
          EOF

      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Build exact common predecessor machinery through critical choice
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build \
            Erdos1135.KrasikovLagarias.K19SourceBridge \
            Erdos1135.KrasikovLagarias.AdaptiveCriticalChoice \
            2>&1 | tee ../logs/base_build.out
          grep -q 'Build completed successfully' ../logs/base_build.out
          printf '%s\n' \
            'K19_STRUCTURAL_BASE_SOURCE_BRIDGE=PASS' \
            'K19_STRUCTURAL_BASE_CRITICAL_CHOICE=PASS' \
            | tee ../logs/base.verdict

      - name: Save exact structural base boundary
        uses: actions/cache/save@v5
        with:
          path: source/.lake/build
          key: ${{ env.STRUCTURAL_CACHE_KEY }}-${{ github.sha }}

      - name: Upload base evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k19-structural-base-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30

  final:
    needs: base
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare byte-identical structural tree
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs source formal_tools
          base64 --decode collatz_k19/k19_formal_patch_tools.tar.gz.b64 \
            > "$RUNNER_TEMP/formal_tools.tar.gz"
          echo "$FORMAL_TOOLS_SHA256  $RUNNER_TEMP/formal_tools.tar.gz" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/formal_tools.tar.gz" -C formal_tools
          chmod +x formal_tools/*.py collatz_k19/*.sh
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          python3 collatz_k19/verify_pinned_source.py source | tee logs/pinned_source.out
          collatz_k19/prepare_k19_structural_stub_tree.sh source formal_tools \
            | tee logs/structural_tree.out
          cat >> source/lakefile.toml <<'EOF'

          [[lean_lib]]
          name = "CollatzPredecessorK19"

          [[lean_lib]]
          name = "K19AxiomAudit"
          EOF

      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Fetch exact dependencies
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get

      - name: Restore exact structural base boundary
        uses: actions/cache/restore@v5
        with:
          path: source/.lake/build
          key: ${{ env.STRUCTURAL_CACHE_KEY }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Compile final bridges, all-target theorem, and axiom audit
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake build CollatzPredecessorK19 K19AxiomAudit \
            2>&1 | tee ../logs/final_build.out
          grep -q 'Build completed successfully' ../logs/final_build.out
          lake env lean K19AxiomAudit.lean \
            2>&1 | tee ../logs/axiom_audit.out
          grep -q 'k19Gamma14551EncodedCertificate_valid' ../logs/axiom_audit.out
          grep -q 'k19AdaptiveForcedPotentialCertificate_valid' ../logs/axiom_audit.out
          if grep -q 'sorryAx' ../logs/axiom_audit.out; then exit 5; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              CollatzPredecessorK19.lean Erdos1135/KrasikovLagarias/K19*.lean; then
            exit 6
          fi
          printf '%s\n' \
            'K19_ALL_TARGET_STRUCTURAL_BUILD=PASS' \
            'K19_ALL_TARGET_ONLY_EXPLICIT_CERTIFICATE_STUBS=PASS' \
            'K19_ALL_TARGET_STRUCTURAL_NO_SORRYAX=PASS' \
            | tee ../logs/verdict.out

      - name: Upload final structural evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k19-all-target-structural-split-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
