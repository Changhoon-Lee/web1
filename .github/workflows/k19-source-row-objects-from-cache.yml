name: K19 Source Exact Row Objects From Proven Metadata

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/source_row_objects_trigger.env
  workflow_dispatch:

permissions:
  contents: read

env:
  LEAN_STACK_SIZE_KB: 1572864
  METADATA_CACHE_KEY: k19-source-split-metadata-Linux-352f2f8dbecff8ed81b2cc986ee8e97c39b772e6
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b
  REPRODUCERS_SHA256: bb34a603feea4865a48ef26345b087f5f961ae7ace78c2acba254b071732a914
  FORMAL_TOOLS_SHA256: 53923fd035af8a5edd442bfb9dee583c0774e41de0899cc445e859fa7214e495
  WEIGHT_SHA256: 82a71c4e1ca22ea94c0d3338fbea93c8d052e659a65a2101a1643bfdda7f8d79
  POTENTIAL_SHA256: 728ed6fbe2def7f37e41b5568feefe3553a3d7c43553aee6ee5495f7ae241e39

jobs:
  row:
    name: source-row-${{ matrix.idx }}
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - idx: '00'
            module: Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Rows00
          - idx: '01'
            module: Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Rows01
          - idx: '02'
            module: Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Rows02
          - idx: '03'
            module: Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Rows03
          - idx: '04'
            module: Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Rows04
          - idx: '05'
            module: Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Rows05
          - idx: '06'
            module: Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Rows06
          - idx: '07'
            module: Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Rows07
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and authenticate exact K19 payloads
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs reproducers formal_tools source
          base64 --decode collatz_k19/k19_reproducers.tar.gz.b64 > "$RUNNER_TEMP/reproducers.tar.gz"
          base64 --decode collatz_k19/k19_formal_patch_tools.tar.gz.b64 > "$RUNNER_TEMP/formal_tools.tar.gz"
          echo "$REPRODUCERS_SHA256  $RUNNER_TEMP/reproducers.tar.gz" | sha256sum --check -
          echo "$FORMAL_TOOLS_SHA256  $RUNNER_TEMP/formal_tools.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/reproducers.tar.gz" -C reproducers
          tar -xzf "$RUNNER_TEMP/formal_tools.tar.gz" -C formal_tools
          chmod +x reproducers/*.sh formal_tools/*.sh formal_tools/*.py
          WORK="$RUNNER_TEMP/k19_replay"
          /usr/bin/time -v reproducers/reproduce_all.sh "$WORK" 4 \
            2>&1 | tee 'logs/reconstruction.${{ matrix.idx }}.out'
          echo "$WEIGHT_SHA256  $WORK/k19_gamma14551_16000.u32le" | sha256sum --check -
          echo "$POTENTIAL_SHA256  $WORK/k19_adaptive_potential.u8" | sha256sum --check -
          ARCHIVE="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$ARCHIVE"
          echo "$SOURCE_ARCHIVE_SHA256  $ARCHIVE" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C source --strip-components=1
          python3 collatz_k19/verify_pinned_source.py source \
            | tee 'logs/pinned_source.${{ matrix.idx }}.out'

      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Generate byte-identical successful source modules
        shell: bash
        run: |
          set -euxo pipefail
          cd source
          lake update
          lake exe cache get
          cd ..
          WORK="$RUNNER_TEMP/k19_replay"
          cp collatz_k19/StreamingCertificate.lean \
            source/Erdos1135/KrasikovLagarias/StreamingCertificate.lean
          cp collatz_k19/ChunkedStreamingCertificate.lean \
            source/Erdos1135/KrasikovLagarias/ChunkedStreamingCertificate.lean
          python3 formal_tools/generate_hex_artifacts.py \
            "$WORK/k19_gamma14551_16000.u32le" \
            source/artifacts/kl_predecessor/k19_g14551_16000 \
            --chunk-bytes 33554432 | tee 'logs/hex.${{ matrix.idx }}.out'
          python3 collatz_k19/generate_k19_source_chunked.py source --row-chunks 8 \
            | tee 'logs/generator.${{ matrix.idx }}.out'
          sha256sum \
            source/Erdos1135/KrasikovLagarias/Generated/K19Gamma14551Data.lean \
            source/Erdos1135/KrasikovLagarias/Generated/K19Gamma14551Metadata.lean \
            | tee 'logs/generated_source.${{ matrix.idx }}.sha256'

      - name: Restore exact compiled source MetadataValid boundary
        uses: actions/cache/restore@v5
        with:
          path: source/.lake/build
          key: ${{ env.METADATA_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Authenticate restored source boundary
        shell: bash
        run: |
          set -euxo pipefail
          BASE=source/.lake/build/lib/lean/Erdos1135/KrasikovLagarias
          GEN="$BASE/Generated"
          for module in StreamingCertificate ChunkedStreamingCertificate; do
            test -s "$BASE/$module.olean"
            sha256sum "$BASE/$module.olean" | tee -a 'logs/restored.${{ matrix.idx }}.sha256'
          done
          for module in K19Gamma14551Data K19Gamma14551Metadata; do
            test -s "$GEN/$module.olean"
            sha256sum "$GEN/$module.olean" | tee -a 'logs/restored.${{ matrix.idx }}.sha256'
          done

      - name: Add non-conflicting swap
        shell: bash
        run: |
          set -euxo pipefail
          sudo fallocate -l 12G '/mnt/k19-source-row-${{ matrix.idx }}.swap'
          sudo chmod 600 '/mnt/k19-source-row-${{ matrix.idx }}.swap'
          sudo mkswap '/mnt/k19-source-row-${{ matrix.idx }}.swap'
          sudo swapon '/mnt/k19-source-row-${{ matrix.idx }}.swap'
          swapon --show | tee 'logs/swap.${{ matrix.idx }}.out'

      - name: Prove one exact consecutive source interval
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          heartbeat() {
            while true; do
              echo "SOURCE_ROW_${{ matrix.idx }}_HEARTBEAT $(date -u +%FT%TZ)"
              free -h | sed -n '1,3p'
              sleep 30
            done
          }
          heartbeat & hb=$!
          set +e
          /usr/bin/time -v timeout 12000 lake build '${{ matrix.module }}' \
            2>&1 | tee '../logs/row.${{ matrix.idx }}.out'
          status=${PIPESTATUS[0]}
          set -e
          kill "$hb" 2>/dev/null || true
          wait "$hb" 2>/dev/null || true
          test "$status" -eq 0
          grep -q 'Build completed successfully' '../logs/row.${{ matrix.idx }}.out'
          BASE=.lake/build/lib/lean/Erdos1135/KrasikovLagarias
          GEN="$BASE/Generated"
          test -s "$GEN/K19Gamma14551Rows${{ matrix.idx }}.olean"
          mkdir -p ../row_artifact
          cp "$GEN/K19Gamma14551Rows${{ matrix.idx }}.olean" ../row_artifact/
          for dep in StreamingCertificate ChunkedStreamingCertificate; do
            sha256sum "$BASE/$dep.olean" | awk '{print $1}' \
              > "../row_artifact/$dep.${{ matrix.idx }}.sha256"
          done
          for dep in K19Gamma14551Data K19Gamma14551Metadata; do
            sha256sum "$GEN/$dep.olean" | awk '{print $1}' \
              > "../row_artifact/$dep.${{ matrix.idx }}.sha256"
          done
          cat > K19SourceRowAxiomAudit.lean <<EOF
          import ${{ matrix.module }}
          #print axioms Erdos1135.KrasikovLagarias.k19Gamma14551Rows${{ matrix.idx }}
          EOF
          lake env lean K19SourceRowAxiomAudit.lean \
            2>&1 | tee '../logs/axiom.${{ matrix.idx }}.out'
          if grep -q 'sorryAx' '../logs/axiom.${{ matrix.idx }}.out'; then exit 5; fi
          printf '%s\n' \
            'K19_SOURCE_METADATA_BOUNDARY_AUTHENTICATED=PASS' \
            'K19_SOURCE_ROW_${{ matrix.idx }}_NATIVE=PASS' \
            'K19_SOURCE_ROW_${{ matrix.idx }}_NO_SORRYAX=PASS' \
            | tee '../logs/row.${{ matrix.idx }}.verdict'

      - name: Upload exact source row proof object
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: k19-source-row-${{ matrix.idx }}-${{ github.run_id }}
          path: row_artifact/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Upload exact source row evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k19-source-row-evidence-${{ matrix.idx }}-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
