name: Fractional-Power Feasibility Lean Gate

on:
  workflow_dispatch:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/FractionalPowerFeasibility.lean
      - .github/workflows/fractional-power-feasibility.yml

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Lean project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source logs
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          cp collatz_k19/FractionalPowerFeasibility.lean source/
          sha256sum collatz_k19/FractionalPowerFeasibility.lean | tee logs/source.sha256
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false
      - name: Fetch pinned dependencies and build elimination trace
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build Erdos1135.KrasikovLagarias.EliminationTrace \
            2>&1 | tee ../logs/dependencies.out
          grep -q 'Build completed successfully' ../logs/dependencies.out
      - name: Compile theorem and audit axioms
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake env lean FractionalPowerFeasibility.lean 2>&1 | tee ../logs/lean.out
          if grep -q 'sorryAx' ../logs/lean.out; then exit 5; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              FractionalPowerFeasibility.lean; then exit 6; fi
          grep -q 'coefficientValue_rpow_le' ../logs/lean.out
          grep -q 'feasible_poweredCoefficients' ../logs/lean.out
          printf '%s\n' \
            'RETARDED_EXPR_CONCAVE_POWER_TRANSPORT=PASS' \
            'FRACTIONAL_POWER_FEASIBILITY=PASS' \
            'NO_SORRYAX=PASS' \
            'FORMAL_GATE=PASS' \
            | tee ../logs/verdict.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fractional-power-feasibility-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
