name: K19 Unweighted Adaptive Tree Coefficient Probe

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/k19_unweighted_tree_probe.cpp
      - .github/workflows/k19-unweighted-tree-probe.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  REPRODUCERS_SHA256: bb34a603feea4865a48ef26345b087f5f961ae7ace78c2acba254b071732a914
  POTENTIAL_SHA256: 728ed6fbe2def7f37e41b5568feefe3553a3d7c43553aee6ee5495f7ae241e39

jobs:
  exact-unweighted-tree-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install exact probe dependency
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libboost-dev

      - name: Reconstruct and authenticate exact K19 adaptive potential
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs reproducers
          base64 --decode collatz_k19/k19_reproducers.tar.gz.b64 \
            > "$RUNNER_TEMP/reproducers.tar.gz"
          echo "$REPRODUCERS_SHA256  $RUNNER_TEMP/reproducers.tar.gz" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/reproducers.tar.gz" -C reproducers
          chmod +x reproducers/*.sh
          WORK="$RUNNER_TEMP/k19_replay"
          /usr/bin/time -v reproducers/reproduce_all.sh "$WORK" 4 \
            2>&1 | tee logs/reconstruction.out
          echo "$POTENTIAL_SHA256  $WORK/k19_adaptive_potential.u8" \
            | sha256sum --check - | tee logs/potential-hash.out
          echo "POTENTIAL_FILE=$WORK/k19_adaptive_potential.u8" >> "$GITHUB_ENV"

      - name: Compile conservative downward-rounded coefficient probe
        shell: bash
        run: |
          set -euxo pipefail
          g++ -O3 -std=c++20 -Wall -Wextra -Wpedantic \
            collatz_k19/k19_unweighted_tree_probe.cpp \
            -o "$RUNNER_TEMP/k19_unweighted_tree_probe"
          sha256sum collatz_k19/k19_unweighted_tree_probe.cpp \
            "$RUNNER_TEMP/k19_unweighted_tree_probe" \
            | tee logs/probe.sha256

      - name: Evaluate exact adaptive normal forms on the all-one coefficient vector
        shell: bash
        run: |
          set -euxo pipefail
          /usr/bin/time -v "$RUNNER_TEMP/k19_unweighted_tree_probe" \
            "$POTENTIAL_FILE" 20000000 256 \
            2>&1 | tee logs/unweighted-tree.txt
          grep -q '^F0=' logs/unweighted-tree.txt
          grep -q '^ROOTS=' logs/unweighted-tree.txt
          grep -q '^PASS_COUNT=' logs/unweighted-tree.txt
          sha256sum logs/* | tee logs/manifest.sha256

      - name: Upload exact unweighted-tree evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k19-unweighted-tree-probe-${{ github.run_id }}
          path: logs/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6
