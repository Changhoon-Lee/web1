name: T090 Inspect K19 Uniform Constant

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - .github/workflows/t090-inspect-k19-uniform-constant.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned source and extract theorem neighborhood
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source logs/files
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          grep -R -n -C 40 -E \
            'phiValues19_exponential_lower_bound|gamma14551|lambda14551|envelopeConstant' \
            source --include='*.lean' > logs/theorem-neighborhood.txt || true
          grep -R -l -E \
            'phiValues19_exponential_lower_bound|gamma14551|lambda14551' \
            source --include='*.lean' > logs/matching-files.txt || true
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            rel="${file#source/}"
            mkdir -p "logs/files/$(dirname "$rel")"
            cp "$file" "logs/files/$rel"
          done < logs/matching-files.txt
          find logs -type f -print0 | sort -z | xargs -0 sha256sum > logs/sha256.txt

      - name: Upload source inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: t090-k19-uniform-constant-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
