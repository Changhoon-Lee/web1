name: T090 Inspect K19 Uniform Constant

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - .github/workflows/t090-inspect-k19-uniform-constant.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b
  FORMAL_TOOLS_SHA256: 53923fd035af8a5edd442bfb9dee583c0774e41de0899cc445e859fa7214e495

jobs:
  inspect-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Generate reviewed K19 overlay and extract theorem neighborhood
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source logs/files formal_tools
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          base64 --decode collatz_k19/k19_formal_patch_tools.tar.gz.b64 \
            > "$RUNNER_TEMP/formal_tools.tar.gz"
          echo "$FORMAL_TOOLS_SHA256  $RUNNER_TEMP/formal_tools.tar.gz" \
            | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/formal_tools.tar.gz" -C formal_tools
          chmod +x formal_tools/*.py formal_tools/*.sh
          python3 formal_tools/generate_k19_overlay_strict.py source \
            | tee logs/overlay.out
          grep -R -n -C 60 -E \
            'phiValues19_exponential_lower_bound|gamma14551|lambda14551|envelopeConstant|adaptiveMargin|criticalMargin' \
            source --include='*.lean' > logs/theorem-neighborhood.txt || true
          grep -R -l -E \
            'phiValues19_exponential_lower_bound|gamma14551|lambda14551|adaptiveMargin|criticalMargin' \
            source --include='*.lean' > logs/matching-files.txt || true
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            rel="${file#source/}"
            mkdir -p "logs/files/$(dirname "$rel")"
            cp "$file" "logs/files/$rel"
          done < logs/matching-files.txt
          find formal_tools -maxdepth 2 -type f -print0 | sort -z \
            | xargs -0 grep -n -H -E \
              'phiValues19_exponential_lower_bound|gamma14551|lambda14551|envelopeConstant|adaptiveMargin|criticalMargin' \
              > logs/generator-neighborhood.txt || true
          find logs -type f -print0 | sort -z | xargs -0 sha256sum > logs/sha256.txt

      - name: Upload source inspection evidence
        uses: actions/upload-artifact@v4
        with:
          name: t090-k19-uniform-constant-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
