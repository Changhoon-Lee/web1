name: V27.2 Full-Suite Traceback

on:
  push:
    branches: [v272-inverse-accounting]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  traceback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-v272.txt
      - name: Run and report
        shell: bash
        run: |
          set +e
          python -m unittest tests.test_v272 > v272-full.log 2>&1
          status=$?
          tail -n 120 v272-full.log
          if [ "$status" -ne 0 ] && [ "${{ github.event_name }}" = "pull_request" ]; then
            {
              echo '### V27.2 full-suite traceback'
              echo '```text'
              tail -n 80 v272-full.log
              echo '```'
            } > comment.md
            gh pr comment "${{ github.event.pull_request.number }}" --body-file comment.md
          fi
          exit "$status"
