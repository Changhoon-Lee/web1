name: V27.2 Authority Result Issue

on:
  push:
    branches: [v272-inverse-accounting]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-v272.txt
      - name: run
        continue-on-error: true
        run: python scripts/run_v272_authority_tests.py
      - name: publish
        run: |
          TITLE=$(python - <<'PY'
          import json
          r=json.load(open('V272_AUTHORITY_RESULTS.json'))
          names=','.join(x['test'].split('.')[-1] for x in r['failures']) or 'NONE'
          print('V272_AUTHORITY_RESULT '+names[:180])
          PY
          )
          gh issue create --title "$TITLE" --body-file V272_AUTHORITY_RESULTS.json
