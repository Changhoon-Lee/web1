name: K19 Coefficient / Cutoff Cancellation Lean Gate

on:
  workflow_dispatch:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/K19CoefficientCutoffCancellation.lean
      - .github/workflows/k19-coefficient-cutoff-cancellation.yml

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Lean project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source logs
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          cp collatz_k19/K19CoefficientCutoffCancellation.lean source/
          sha256sum collatz_k19/K19CoefficientCutoffCancellation.lean \
            | tee logs/source.sha256
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false
      - name: Fetch pinned dependencies
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
      - name: Compile and audit
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake env lean K19CoefficientCutoffCancellation.lean \
            2>&1 | tee ../logs/lean.out
          if grep -q 'sorryAx' ../logs/lean.out; then exit 5; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              K19CoefficientCutoffCancellation.lean; then exit 6; fi
          grep -q 'exact_cutoff_cancellation' ../logs/lean.out
          grep -q 'reciprocal_lower_bound_of_coefficient_lower_bound' \
            ../logs/lean.out
          printf '%s\n' \
            'K19_COEFFICIENT_THETA_ROOT_CUTOFF_CANCELLATION=PASS' \
            'UNWEIGHTED_SOURCE_RECIPROCAL_CONSUMER=PASS' \
            'VARIABLE_CUTOFF_CAPACITY=EXPLICITLY_SEPARATE' \
            'NO_SORRYAX=PASS' \
            'FORMAL_GATE=PASS' \
            | tee ../logs/verdict.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k19-coefficient-cutoff-cancellation-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
