name: T089 Unit Inverse Steering Lean Gate

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/UnitInverseSteering.lean
      - collatz_k19/UnitInverseSteeringActual.lean
      - .github/workflows/t089-unit-inverse-steering-lean.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned Lean project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source logs
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          cp collatz_k19/UnitInverseSteering.lean source/
          cp collatz_k19/UnitInverseSteeringActual.lean source/
          sha256sum \
            collatz_k19/UnitInverseSteering.lean \
            collatz_k19/UnitInverseSteeringActual.lean \
            | tee logs/source.sha256

      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Fetch pinned dependencies
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get

      - name: Compile theorem and audit axioms
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake env lean UnitInverseSteering.lean 2>&1 | tee ../logs/lean.out
          lake env lean UnitInverseSteeringActual.lean 2>&1 | tee -a ../logs/lean.out
          if grep -q 'sorryAx' ../logs/lean.out; then exit 5; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              UnitInverseSteering.lean UnitInverseSteeringActual.lean; then
            exit 6
          fi
          grep -q 'UnitInverseSteering.finite_policy_valid' ../logs/lean.out
          grep -q 'UnitInverseSteering.total_length_bound' ../logs/lean.out
          grep -q 'UnitInverseSteering.actual_one_step_exists' ../logs/lean.out
          grep -q 'UnitInverseSteering.actual_path_exists_with_length' ../logs/lean.out
          printf '%s\n' \
            'UNIT_INVERSE_FINITE_POLICY_NATIVE=PASS' \
            'UNIT_INVERSE_TELESCOPING_BUILD=PASS' \
            'UNIT_INVERSE_ACTUAL_INTEGER_LIFT=PASS' \
            'UNIT_INVERSE_ALL_DEPTH_ACTUAL_PATH=PASS' \
            'UNIT_INVERSE_NO_SORRYAX=PASS' \
            'FORMAL_GATE=PASS' \
            | tee ../logs/verdict.out

      - name: Upload Lean proof evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t089-unit-inverse-steering-lean-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
