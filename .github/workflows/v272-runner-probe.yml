name: V27.2 Runner Probe

on:
  push:
    branches: [v272-inverse-accounting]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}/src
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -q -r requirements-v272.txt
      - name: generate-runner-result
        continue-on-error: true
        run: python scripts/run_v272_authority_tests.py
      - name: probe-01
        continue-on-error: true
        run: python -c "import json; f={x['test'] for x in json.load(open('V272_AUTHORITY_RESULTS.json'))['failures']}; raise SystemExit('tests.test_v272.V272Tests.test_01_config_validates' in f)"
      - name: probe-02
        continue-on-error: true
        run: python -c "import json; f={x['test'] for x in json.load(open('V272_AUTHORITY_RESULTS.json'))['failures']}; raise SystemExit('tests.test_v272.V272Tests.test_02_inverse_contract_pnl_identity' in f)"
      - name: probe-03
        continue-on-error: true
        run: python -c "import json; f={x['test'] for x in json.load(open('V272_AUTHORITY_RESULTS.json'))['failures']}; raise SystemExit('tests.test_v272.V272Tests.test_03_inverse_short_profit_on_price_fall' in f)"
      - name: probe-04
        continue-on-error: true
        run: python -c "import json; f={x['test'] for x in json.load(open('V272_AUTHORITY_RESULTS.json'))['failures']}; raise SystemExit('tests.test_v272.V272Tests.test_04_funding_sign' in f)"
      - name: probe-05
