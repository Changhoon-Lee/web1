      - name: probe-06
        continue-on-error: true
        run: python -c "import json; f={x['test'] for x in json.load(open('V272_AUTHORITY_RESULTS.json'))['failures']}; raise SystemExit('tests.test_v272.V272Tests.test_06_free_snapshot_contains_actual_perpetual_fields' in f)"
      - name: probe-07
