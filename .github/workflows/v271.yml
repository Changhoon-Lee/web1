name: V27.1 Open-Free Deribit Lab

on:
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Offline synthetic smoke
        run: |
          python tools/make_synthetic_fixture.py
          python -m src.v271_cli run --root .
          python -m src.v271_cli verify --root .
          python -m src.v271_cli pack --root .
      - name: Stage verified source
        run: |
          rm -rf artifact_stage
          mkdir artifact_stage
          rsync -a --exclude '.git' --exclude '.venv' --exclude '__pycache__' --exclude 'data' --exclude 'v271_results' --exclude 'runtime' --exclude 'artifact_stage' ./ artifact_stage/
      - name: Upload verified ZIP
        uses: actions/upload-artifact@v4
        with:
          name: V27_1_Open_Free_Deribit_Final
          path: artifact_stage
          if-no-files-found: error
          compression-level: 0
