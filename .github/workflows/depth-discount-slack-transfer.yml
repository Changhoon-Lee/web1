name: Depth-Discount Slack Transfer Lean Gate

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/DepthDiscountSlackTransfer.lean
      - .github/workflows/depth-discount-slack-transfer.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Lean project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source logs
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          cp collatz_k19/DepthDiscountSlackTransfer.lean source/
          sha256sum collatz_k19/DepthDiscountSlackTransfer.lean | tee logs/source.sha256
      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false
      - name: Fetch pinned dependencies
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
      - name: Compile theorem and audit axioms
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake env lean DepthDiscountSlackTransfer.lean 2>&1 | tee ../logs/lean.out
          if grep -q 'sorryAx' ../logs/lean.out; then exit 5; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              DepthDiscountSlackTransfer.lean; then exit 6; fi
          grep -q 'DepthDiscountSlackTransfer.qSquared_row' ../logs/lean.out
          grep -q 'DepthDiscountSlackTransfer.qMixed_row' ../logs/lean.out
          grep -q 'DepthDiscountSlackTransfer.k19_q_scalar' ../logs/lean.out
          grep -q 'DepthDiscountSlackTransfer.k19_q_strict' ../logs/lean.out
          printf '%s\n' \
            'SLACK_TO_Q2_ROW=PASS' \
            'MIXED_Q2_Q_ROW=PASS' \
            'K19_Q_SCALAR=PASS' \
            'K19_Q_LT_ONE=PASS' \
            'NO_SORRYAX=PASS' \
            'FORMAL_GATE=PASS' | tee ../logs/verdict.out
      - name: Upload Lean evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: depth-discount-slack-transfer-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
