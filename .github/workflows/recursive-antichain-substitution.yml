name: Recursive Antichain Substitution Lean Gate

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/ReachabilityAntichainCapacity.lean
      - collatz_k19/RecursiveAntichainSubstitution.lean
      - .github/workflows/recursive-antichain-substitution.yml
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_METADATA_CACHE_KEY: k19-source-split-metadata-Linux-352f2f8dbecff8ed81b2cc986ee8e97c39b772e6
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Prepare pinned Lean project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source logs
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          cp collatz_k19/ReachabilityAntichainCapacity.lean source/
          cp collatz_k19/RecursiveAntichainSubstitution.lean source/
          sha256sum \
            collatz_k19/ReachabilityAntichainCapacity.lean \
            collatz_k19/RecursiveAntichainSubstitution.lean \
            | tee logs/source.sha256

      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Fetch pinned dependencies
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get

      - name: Restore pinned source build boundary
        uses: actions/cache/restore@v5
        with:
          path: source/.lake/build
          key: ${{ env.SOURCE_METADATA_CACHE_KEY }}
          fail-on-cache-miss: true

      - name: Compile substitution theorem and audit axioms
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake env lean ReachabilityAntichainCapacity.lean \
            -o .lake/build/lib/lean/ReachabilityAntichainCapacity.olean \
            -i .lake/build/lib/lean/ReachabilityAntichainCapacity.ilean \
            2>&1 | tee ../logs/reachability.out
          lake env lean RecursiveAntichainSubstitution.lean \
            -o .lake/build/lib/lean/RecursiveAntichainSubstitution.olean \
            -i .lake/build/lib/lean/RecursiveAntichainSubstitution.ilean \
            2>&1 | tee ../logs/lean.out
          if grep -q 'sorryAx' ../logs/lean.out; then exit 5; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              RecursiveAntichainSubstitution.lean; then exit 6; fi
          grep -q 'unique_antichain_parent_of_common_predecessor' ../logs/lean.out
          grep -q 'fibered_predecessor_union_antichain' ../logs/lean.out
          printf '%s\n' \
            'ANTICHAIN_PARENT_UNIQUENESS=PASS' \
            'MIXED_DEPTH_FIBERED_SUBSTITUTION=PASS' \
            'NO_SORRYAX=PASS' \
            'FORMAL_GATE=PASS' \
            | tee ../logs/verdict.out

      - name: Upload Lean evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recursive-antichain-substitution-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 6
