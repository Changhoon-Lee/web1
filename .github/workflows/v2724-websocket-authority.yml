name: V27.2.4 WebSocket Authority

on:
  push:
    branches: [v2724-websocket-authority]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -q -r requirements-v2724.txt
      - name: Run 45 authority tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          PYTHONHASHSEED: '0'
          OMP_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
        run: python scripts/run_v2724_authority_tests.py
      - name: Fail-closed smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          rm -rf data/v2724_ws_chain v2724_results runtime
          mkdir -p data/v2724_ws_chain
          python src/v2724_cli.py all --data data/v2724_ws_chain --output v2724_results --handoff runtime/V2724_WebSocket_Authority_Handoff.zip
          python src/v2724_cli.py verify --output v2724_results
          python - <<'PY'
          import json
          gate=json.load(open('v2724_results/FINAL_GATE.json'))
          assert gate['overall_status']=='FREE_OPEN_DATA_CONTINUITY_NOT_READY'
          assert gate['economic_metrics_allowed'] is False
          assert gate['transport']=='public_websocket_agg2'
          PY
      - name: Stage sanitized authority tree
        run: |
          rm -rf artifact_stage
          mkdir -p artifact_stage/src artifact_stage/tests artifact_stage/scripts
          cp src/v272_core.py src/v272_core_legacy.py src/v272_free.py src/v272_cli.py src/v2724_ws.py src/v2724_cli.py artifact_stage/src/
          cp tests/test_v272.py tests/test_v272_wrapper.py tests/test_v2724_ws.py artifact_stage/tests/
          cp scripts/run_v2724_authority_tests.py artifact_stage/scripts/
          cp requirements-v2724.txt V2724_PROTOCOL.json V2724_README.md artifact_stage/
          cp RUN_V2724_EVERYTHING.command INSTALL_AND_START_V2724.command V2724_SAFE_LAUNCHER.sh artifact_stage/
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path('artifact_stage')
          files=[]
          for path in sorted(root.rglob('*')):
              if path.is_file():
                  files.append({'path':str(path.relative_to(root)), 'size':path.stat().st_size, 'sha256':hashlib.sha256(path.read_bytes()).hexdigest()})
          payload=json.dumps(files,sort_keys=True,separators=(',',':')).encode()
          release={
              'protocol':'27.2.4-websocket-authority',
              'commit':'${{ github.sha }}',
              'files':files,
              'tree_sha256':hashlib.sha256(payload).hexdigest(),
              'authority_tests':45,
              'continuous_transport':'public_websocket_agg2',
          }
          (root/'RELEASE_INFO.json').write_text(json.dumps(release,indent=2,sort_keys=True)+'\n')
          authority='\n'.join((root/'src'/name).read_text(errors='ignore') for name in ('v2724_ws.py','v2724_cli.py'))
          forbidden=['tardis_dev','private/subscribe','ticker.BTC-PERPETUAL.raw','public/ticker','get_book_summary_by_currency']
          for token in forbidden:
              if token in authority:
                  raise SystemExit(f'forbidden authority token: {token}')
          PY
      - name: Clean-tree verification
        run: |
          cd artifact_stage
          python -m pip install -q -r requirements-v2724.txt
          export PYTHONPATH="$PWD/src"
          python scripts/run_v2724_authority_tests.py
          mkdir -p data/v2724_ws_chain
          python src/v2724_cli.py all --data data/v2724_ws_chain --output v2724_results --handoff runtime/V2724_WebSocket_Authority_Handoff.zip
          python src/v2724_cli.py verify --output v2724_results
      - name: Deterministic ZIP proof
        run: |
          rm -rf artifact_stage/data artifact_stage/v2724_results artifact_stage/runtime artifact_stage/**/__pycache__
          python - <<'PY'
          from pathlib import Path
          import hashlib,zipfile
          root=Path('artifact_stage'); out=Path('V2724_WebSocket_Authority_Final.proof.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as archive:
              for path in sorted(root.rglob('*')):
                  if not path.is_file():
                      continue
                  info=zipfile.ZipInfo(str(path.relative_to(root)))
                  info.date_time=(1980,1,1,0,0,0)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o755 if path.suffix in {'.command','.sh','.py'} else 0o644)<<16
                  archive.writestr(info,path.read_bytes())
          print('proof_zip_sha256',hashlib.sha256(out.read_bytes()).hexdigest())
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: V2724_WebSocket_Authority_Final
          path: artifact_stage/
          if-no-files-found: error
          retention-days: 90
