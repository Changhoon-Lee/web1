name: Depth-Budget Fractional-Power Lean Gate

on:
  workflow_dispatch:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - collatz_k19/DepthBudgetRetarded.lean
      - collatz_k19/DepthBudgetFractionalPower.lean
      - .github/workflows/depth-budget-fractional-power.yml

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  lean-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Prepare pinned Lean project
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p source logs
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          cp collatz_k19/DepthBudgetRetarded.lean source/
          cp collatz_k19/DepthBudgetFractionalPower.lean source/
          sha256sum \
            collatz_k19/DepthBudgetRetarded.lean \
            collatz_k19/DepthBudgetFractionalPower.lean \
            | tee logs/source.sha256
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false
      - name: Fetch pinned dependencies
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
      - name: Compile depth modules and audit axioms
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p .lake/build/lib/lean
          lake env lean DepthBudgetRetarded.lean \
            -o .lake/build/lib/lean/DepthBudgetRetarded.olean \
            -i .lake/build/lib/lean/DepthBudgetRetarded.ilean \
            2>&1 | tee ../logs/depth-core.out
          lake env lean DepthBudgetFractionalPower.lean \
            2>&1 | tee ../logs/lean.out
          if grep -q 'sorryAx' ../logs/lean.out; then exit 5; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              DepthBudgetFractionalPower.lean; then exit 6; fi
          grep -q 'coefficientValue_rpow_le' ../logs/lean.out
          grep -q 'choice_poweredCoefficients' ../logs/lean.out
          printf '%s\n' \
            'DEPTH_BUDGET_COEFFICIENT_POWER_TRANSPORT=PASS' \
            'DEPTH_COSTS_UNCHANGED=PASS' \
            'CHOICE_PROPERTY_PRESERVED=PASS' \
            'NO_SORRYAX=PASS' \
            'FORMAL_GATE=PASS' \
            | tee ../logs/verdict.out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: depth-budget-fractional-power-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
