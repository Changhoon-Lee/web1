name: V27 Free Open Data Only

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Run V27 tests
        run: |
          export PYTHONHASHSEED=0
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export NUMEXPR_NUM_THREADS=1
          python -m unittest discover -s tests -p 'test_v27*.py' -v
      - name: Free-only fail-closed smoke
        run: |
          rm -rf data/v27_free_chain v27_free_results runtime
          mkdir -p data/v27_free_chain
          python src/v27_free_open.py all --data data/v27_free_chain --output v27_free_results --handoff runtime/V27_Free_Open_Data_Only_Handoff.zip --no-record
          python src/v27_free_verify.py --output v27_free_results
          test -f runtime/V27_Free_Open_Data_Only_Handoff.zip
      - name: Stage verified source
        run: |
          rm -rf artifact_stage
          mkdir artifact_stage
          rsync -a ./ artifact_stage/ \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude 'artifact_stage' \
            --exclude 'data/v27_free_chain/*' \
            --exclude 'v27_free_results' \
            --exclude 'runtime'
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('artifact_stage')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  rows.append({'path':str(p.relative_to(root)), 'size':p.stat().st_size, 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          payload=json.dumps(rows,sort_keys=True,separators=(',',':')).encode()
          (root/'RELEASE_INFO.json').write_text(json.dumps({'protocol':'27.1.0-free-open','commit':'${{ github.sha }}','files':rows,'tree_sha256':hashlib.sha256(payload).hexdigest()},indent=2)+'\n')
          PY
      - name: Build deterministic source zip
        run: |
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('artifact_stage')
          out=Path('V27_Free_Open_Data_Only_Final.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file(): continue
                  info=zipfile.ZipInfo(str(p.relative_to(root)))
                  info.date_time=(1980,1,1,0,0,0)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o755 if p.suffix=='.command' else 0o644)<<16
                  z.writestr(info,p.read_bytes())
          PY
          sha256sum V27_Free_Open_Data_Only_Final.zip
      - uses: actions/upload-artifact@v4
        with:
          name: V27_Free_Open_Data_Only_Final
          path: V27_Free_Open_Data_Only_Final.zip
          if-no-files-found: error
          retention-days: 90
