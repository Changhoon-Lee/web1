name: V27 Free Open Data Only

on:
  push:
    branches: [v27-free-open-data-only]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full CI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-v27.txt
      - name: Run authoritative V27 and free-only tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          export PYTHONHASHSEED=0
          export OMP_NUM_THREADS=1
          export OPENBLAS_NUM_THREADS=1
          export MKL_NUM_THREADS=1
          export NUMEXPR_NUM_THREADS=1
          python -m unittest tests.test_v27 -v
          python -m unittest tests.test_v27_free_open -v
      - name: Free-only fail-closed smoke
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          rm -rf data/v27_free_chain v27_free_results runtime
          mkdir -p data/v27_free_chain
          python src/v27_free_open.py all --data data/v27_free_chain --output v27_free_results --handoff runtime/V27_Free_Open_Data_Only_Handoff.zip --no-record
          python src/v27_free_verify.py --output v27_free_results
          test -f runtime/V27_Free_Open_Data_Only_Handoff.zip
      - name: Stage sanitized free-only source
        run: |
          rm -rf artifact_stage
          mkdir -p artifact_stage/src artifact_stage/tests
          cp requirements.txt artifact_stage/
          cp src/v27_core.py artifact_stage/src/
          cp src/v27_core_legacy.py artifact_stage/src/
          cp src/v27_free_open.py artifact_stage/src/
          cp src/v27_free_verify.py artifact_stage/src/
          cp src/v27_cli_free.py artifact_stage/src/v27_cli.py
          sed -i 's/from v27_cli import build_handoff, coverage_summary, run_lab, verify_results/from v27_cli import run_lab, verify_results/' artifact_stage/src/v27_free_open.py
          cp tests/test_v27_free_open.py artifact_stage/tests/
          cp RUN_V27_FREE_ONLY.command artifact_stage/
          cp V27_FREE_RECORD.command artifact_stage/
          cp V27_FREE_RECORD_CONTINUOUS.command artifact_stage/
          cp V27_FREE_AUDIT.command artifact_stage/
          cp V27_FREE_ONLY_PROTOCOL.json artifact_stage/
          cp V27_FREE_OPEN_DATA_ONLY_README.md artifact_stage/
          python - <<'PY'
          from pathlib import Path
          import hashlib, json
          root=Path('artifact_stage')
          rows=[]
          for p in sorted(root.rglob('*')):
              if p.is_file():
                  rows.append({'path':str(p.relative_to(root)), 'size':p.stat().st_size, 'sha256':hashlib.sha256(p.read_bytes()).hexdigest()})
          payload=json.dumps(rows,sort_keys=True,separators=(',',':')).encode()
          (root/'RELEASE_INFO.json').write_text(json.dumps({'protocol':'27.1.0-free-open','commit':'${{ github.sha }}','files':rows,'tree_sha256':hashlib.sha256(payload).hexdigest()},indent=2)+'\n')
          forbidden=['tardis_dev','TARDIS_API_KEY=','DERIBIT_CLIENT_SECRET=','DERIBIT_CLIENT_ID=']
          text='\n'.join(p.read_text(errors='ignore') for p in root.rglob('*') if p.is_file() and p.suffix in {'.py','.md','.json','.command','.txt'})
          for token in forbidden:
              if token in text:
                  raise SystemExit(f'forbidden paid/private runtime token: {token}')
          PY
      - name: Test sanitized artifact in clean tree
        run: |
          cd artifact_stage
          export PYTHONPATH="$PWD/src"
          python -m unittest tests.test_v27_free_open -v
          rm -rf data/v27_free_chain v27_free_results runtime
          mkdir -p data/v27_free_chain
          python src/v27_free_open.py all --data data/v27_free_chain --output v27_free_results --handoff runtime/V27_Free_Open_Data_Only_Handoff.zip --no-record
          python src/v27_free_verify.py --output v27_free_results
      - name: Build deterministic source zip
        run: |
          rm -rf artifact_stage/data artifact_stage/v27_free_results artifact_stage/runtime artifact_stage/__pycache__ artifact_stage/src/__pycache__ artifact_stage/tests/__pycache__
          python - <<'PY'
          from pathlib import Path
          import zipfile
          root=Path('artifact_stage')
          out=Path('V27_Free_Open_Data_Only_Final.zip')
          with zipfile.ZipFile(out,'w',compression=zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(root.rglob('*')):
                  if not p.is_file(): continue
                  info=zipfile.ZipInfo(str(p.relative_to(root)))
                  info.date_time=(1980,1,1,0,0,0)
                  info.compress_type=zipfile.ZIP_DEFLATED
                  info.external_attr=(0o755 if p.suffix=='.command' else 0o644)<<16
                  z.writestr(info,p.read_bytes())
          PY
          sha256sum V27_Free_Open_Data_Only_Final.zip
      - uses: actions/upload-artifact@v4
        with:
          name: V27_Free_Open_Data_Only_Final
          path: V27_Free_Open_Data_Only_Final.zip
          if-no-files-found: error
          retention-days: 90
