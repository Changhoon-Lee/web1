name: K19 Chunked Metadata Composition Smoke

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - .github/workflows/k19-chunked-metadata-smoke.yml
      - collatz_k19/ChunkedMetadataCertificate.lean
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Fetch pinned source and install exact metadata interval module
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs source
          archive="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$archive"
          echo "$SOURCE_ARCHIVE_SHA256  $archive" | sha256sum --check -
          tar -xzf "$archive" -C source --strip-components=1
          cp collatz_k19/StreamingCertificate.lean \
            source/Erdos1135/KrasikovLagarias/StreamingCertificate.lean
          cp collatz_k19/ChunkedStreamingCertificate.lean \
            source/Erdos1135/KrasikovLagarias/ChunkedStreamingCertificate.lean
          cp collatz_k19/ChunkedMetadataCertificate.lean \
            source/Erdos1135/KrasikovLagarias/ChunkedMetadataCertificate.lean
          cat > source/K19ChunkedMetadataCanary.lean <<'EOF'
          import Erdos1135.KrasikovLagarias.ChunkedMetadataCertificate

          namespace Erdos1135
          namespace KrasikovLagarias

          private theorem canarySize :
              adaptivePotentialK2Canary.values.size =
                EliminationResidue.principalCount adaptivePotentialK2Canary.k := by
            native_decide

          private theorem canaryBoundsLeft :
              adaptivePotentialK2Canary.metadataBoundsCheckRange 0 2 = true := by
            native_decide

          private theorem canaryBoundsRight :
              adaptivePotentialK2Canary.metadataBoundsCheckRange 2 1 = true := by
            native_decide

          private theorem canaryBoundsFull :
              adaptivePotentialK2Canary.metadataBoundsCheckRange 0 3 = true := by
            simpa using
              AdaptiveForcedPotentialCertificate.metadataBoundsCheckRange_append
                adaptivePotentialK2Canary 0 2 1
                canaryBoundsLeft canaryBoundsRight

          theorem canaryMetadataValidFromIntervals :
              adaptivePotentialK2Canary.MetadataValid :=
            AdaptiveForcedPotentialCertificate.metadataValid_of_size_and_full_bounds
              (by norm_num) canarySize (by simpa using canaryBoundsFull)

          #print axioms canaryMetadataValidFromIntervals

          end KrasikovLagarias
          end Erdos1135
          EOF

      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Compile theorem and exact two-interval canary
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          lake update
          lake exe cache get
          lake build Erdos1135.KrasikovLagarias.ChunkedMetadataCertificate \
            2>&1 | tee ../logs/module_build.out
          lake env lean K19ChunkedMetadataCanary.lean \
            2>&1 | tee ../logs/canary_and_axiom_audit.out
          if grep -q 'sorryAx' ../logs/canary_and_axiom_audit.out; then exit 5; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              Erdos1135/KrasikovLagarias/ChunkedMetadataCertificate.lean \
              K19ChunkedMetadataCanary.lean; then
            exit 6
          fi
          printf '%s\n' \
            'K19_METADATA_INTERVAL_THEOREM_COMPILE=PASS' \
            'K19_METADATA_TWO_INTERVAL_CANARY=PASS' \
            'K19_METADATA_INTERVAL_NO_SORRYAX=PASS' \
            | tee ../logs/verdict.out

      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k19-chunked-metadata-smoke-${{ github.run_id }}
          path: logs/
          if-no-files-found: error
          retention-days: 30
