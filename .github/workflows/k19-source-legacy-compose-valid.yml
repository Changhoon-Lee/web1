name: K19 Source Legacy Proof-Object Authentication and Valid Composition

on:
  push:
    branches:
      - collatz-k19-gate-clean-20260808
    paths:
      - .github/workflows/k19-source-legacy-compose-valid.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  LEAN_STACK_SIZE_KB: 1572864
  LEGACY_ROW_RUN_ID: 31240625416
  EXPECTED_LEGACY_DATA_SHA256: b782c886691e6bdd6a558d59dcc3eb46de181ec66dd3175bd2f6ae83bc164850
  EXPECTED_STREAMING_SHA256: 1c6151f790b56166f705cf9b8e76565b7e4cf5a9e15743d1af8ede415036e12c
  EXPECTED_CHUNKED_SHA256: 9cea9a7677948ee8e70aa40caed96d439e01953ea464a759a3de63541d639c00
  SOURCE_URL: https://www.proofatlas.ai/sources/collatz-predecessor-090/commits/5f76a170e74ea5b0c37c56683bd4c1e9d72e5e3f/collatz_predecessor_090-1.0.0.tar.gz
  SOURCE_ARCHIVE_SHA256: bc59cf3067a9377dbc0d4fc32d2eb4f228051f65cf2f41087a0066ef7ddedc9b
  REPRODUCERS_SHA256: bb34a603feea4865a48ef26345b087f5f961ae7ace78c2acba254b071732a914
  FORMAL_TOOLS_SHA256: 53923fd035af8a5edd442bfb9dee583c0774e41de0899cc445e859fa7214e495
  WEIGHT_SHA256: 82a71c4e1ca22ea94c0d3338fbea93c8d052e659a65a2101a1643bfdda7f8d79
  POTENTIAL_SHA256: 728ed6fbe2def7f37e41b5568feefe3553a3d7c43553aee6ee5495f7ae241e39

jobs:
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact assets and pinned source
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p logs reproducers formal_tools source row_artifacts boundary
          base64 --decode collatz_k19/k19_reproducers.tar.gz.b64 > "$RUNNER_TEMP/reproducers.tar.gz"
          base64 --decode collatz_k19/k19_formal_patch_tools.tar.gz.b64 > "$RUNNER_TEMP/formal_tools.tar.gz"
          echo "$REPRODUCERS_SHA256  $RUNNER_TEMP/reproducers.tar.gz" | sha256sum --check -
          echo "$FORMAL_TOOLS_SHA256  $RUNNER_TEMP/formal_tools.tar.gz" | sha256sum --check -
          tar -xzf "$RUNNER_TEMP/reproducers.tar.gz" -C reproducers
          tar -xzf "$RUNNER_TEMP/formal_tools.tar.gz" -C formal_tools
          chmod +x reproducers/*.sh formal_tools/*.sh formal_tools/*.py
          WORK="$RUNNER_TEMP/k19_replay"
          /usr/bin/time -v reproducers/reproduce_all.sh "$WORK" 4 \
            2>&1 | tee logs/reconstruction.out
          echo "$WEIGHT_SHA256  $WORK/k19_gamma14551_16000.u32le" | sha256sum --check -
          echo "$POTENTIAL_SHA256  $WORK/k19_adaptive_potential.u8" | sha256sum --check -
          ARCHIVE="$RUNNER_TEMP/source.tar.gz"
          curl --fail --location --retry 5 --retry-all-errors "$SOURCE_URL" -o "$ARCHIVE"
          echo "$SOURCE_ARCHIVE_SHA256  $ARCHIVE" | sha256sum --check -
          tar -xzf "$ARCHIVE" -C source --strip-components=1
          python3 collatz_k19/verify_pinned_source.py source | tee logs/pinned_source.out

      - name: Install source-pinned Lean
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: source
          auto-config: false
          build: false
          test: false
          use-github-cache: false

      - name: Generate byte-identical legacy monolithic source tree
        shell: bash
        run: |
          set -euxo pipefail
          cd source
          lake update
          lake exe cache get
          cd ..
          WORK="$RUNNER_TEMP/k19_replay"
          cp collatz_k19/StreamingCertificate.lean \
            source/Erdos1135/KrasikovLagarias/StreamingCertificate.lean
          cp collatz_k19/ChunkedStreamingCertificate.lean \
            source/Erdos1135/KrasikovLagarias/ChunkedStreamingCertificate.lean
          python3 formal_tools/generate_hex_artifacts.py \
            "$WORK/k19_gamma14551_16000.u32le" \
            source/artifacts/kl_predecessor/k19_g14551_16000 \
            --chunk-bytes 33554432 | tee logs/hex.out
          python3 collatz_k19/generate_k19_source_monolithic_legacy.py \
            source --row-chunks 8 | tee logs/generator.out
          sha256sum \
            source/Erdos1135/KrasikovLagarias/Generated/K19Gamma14551Data.lean \
            source/Erdos1135/KrasikovLagarias/Generated/K19Gamma14551.lean \
            | tee logs/generated_source.sha256

      - name: Add non-conflicting swap
        shell: bash
        run: |
          set -euxo pipefail
          sudo fallocate -l 12G /mnt/k19-source-legacy-compose.swap
          sudo chmod 600 /mnt/k19-source-legacy-compose.swap
          sudo mkswap /mnt/k19-source-legacy-compose.swap
          sudo swapon /mnt/k19-source-legacy-compose.swap
          swapon --show | tee logs/swap.out

      - name: Rebuild exact legacy Data and MetadataValid boundary once
        working-directory: source
        shell: bash
        run: |
          set -euxo pipefail
          heartbeat() {
            while true; do
              echo "SOURCE_LEGACY_DATA_HEARTBEAT $(date -u +%FT%TZ)"
              free -h | sed -n '1,3p'
              sleep 30
            done
          }
          heartbeat & hb=$!
          set +e
          /usr/bin/time -v timeout 12000 lake build \
            Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Data \
            2>&1 | tee ../logs/data_build.out
          status=${PIPESTATUS[0]}
          set -e
          kill "$hb" 2>/dev/null || true
          wait "$hb" 2>/dev/null || true
          test "$status" -eq 0
          grep -q 'Build completed successfully' ../logs/data_build.out
          BASE=.lake/build/lib/lean/Erdos1135/KrasikovLagarias
          GEN="$BASE/Generated"
          test "$(sha256sum "$GEN/K19Gamma14551Data.olean" | awk '{print $1}')" = \
            "$EXPECTED_LEGACY_DATA_SHA256"
          test "$(sha256sum "$BASE/StreamingCertificate.olean" | awk '{print $1}')" = \
            "$EXPECTED_STREAMING_SHA256"
          test "$(sha256sum "$BASE/ChunkedStreamingCertificate.olean" | awk '{print $1}')" = \
            "$EXPECTED_CHUNKED_SHA256"
          cat > K19LegacyDataAxiomAudit.lean <<'EOF'
          import Erdos1135.KrasikovLagarias.Generated.K19Gamma14551Data
          #print axioms Erdos1135.KrasikovLagarias.k19Gamma14551EncodedEncodingValid
          #print axioms Erdos1135.KrasikovLagarias.k19Gamma14551EncodedCertificate_metadataValid
          EOF
          lake env lean K19LegacyDataAxiomAudit.lean \
            2>&1 | tee ../logs/data_axiom_audit.out
          if grep -q 'sorryAx' ../logs/data_axiom_audit.out; then exit 5; fi
          printf '%s\n' \
            'K19_SOURCE_LEGACY_DATA_SHA256=PASS' \
            'K19_SOURCE_LEGACY_METADATA_VALID=PASS' \
            'K19_SOURCE_LEGACY_DATA_AXIOM_AUDIT=PASS_NO_SORRYAX' \
            | tee ../logs/data.verdict

      - name: Download all eight successful legacy row proof objects
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.LEGACY_ROW_RUN_ID }}
          pattern: k19-source-v2-row-??-${{ env.LEGACY_ROW_RUN_ID }}
          path: row_artifacts
          merge-multiple: true

      - name: Authenticate every legacy proof object and compose public source Valid
        shell: bash
        run: |
          set -euxo pipefail
          BASE=source/.lake/build/lib/lean/Erdos1135/KrasikovLagarias
          GEN="$BASE/Generated"
          actual_data=$(sha256sum "$GEN/K19Gamma14551Data.olean" | awk '{print $1}')
          actual_streaming=$(sha256sum "$BASE/StreamingCertificate.olean" | awk '{print $1}')
          actual_chunked=$(sha256sum "$BASE/ChunkedStreamingCertificate.olean" | awk '{print $1}')
          mapfile -t data_files < <(find row_artifacts -name 'data.??.sha256' -type f | sort)
          mapfile -t streaming_files < <(find row_artifacts -name 'streaming.??.sha256' -type f | sort)
          mapfile -t chunked_files < <(find row_artifacts -name 'chunked.??.sha256' -type f | sort)
          test "${#data_files[@]}" -eq 8
          test "${#streaming_files[@]}" -eq 8
          test "${#chunked_files[@]}" -eq 8
          for file in "${data_files[@]}"; do test "$(cat "$file")" = "$actual_data"; done
          for file in "${streaming_files[@]}"; do test "$(cat "$file")" = "$actual_streaming"; done
          for file in "${chunked_files[@]}"; do test "$(cat "$file")" = "$actual_chunked"; done
          test "$(find row_artifacts -name 'K19Gamma14551Rows??.olean' | wc -l)" -eq 8
          cp row_artifacts/K19Gamma14551Rows??.olean "$GEN/"
          rm -f source/Erdos1135/KrasikovLagarias/Generated/K19Gamma14551Rows??.lean
          cd source
          lake env lean Erdos1135/KrasikovLagarias/Generated/K19Gamma14551.lean \
            -o .lake/build/lib/lean/Erdos1135/KrasikovLagarias/Generated/K19Gamma14551.olean \
            -i .lake/build/lib/lean/Erdos1135/KrasikovLagarias/Generated/K19Gamma14551.ilean \
            2>&1 | tee ../logs/aggregate.out
          cat > K19LegacySourceValidAxiomAudit.lean <<'EOF'
          import Erdos1135.KrasikovLagarias.Generated.K19Gamma14551
          #print axioms Erdos1135.KrasikovLagarias.k19Gamma14551EncodedCertificate_valid
          #print axioms Erdos1135.KrasikovLagarias.k19Gamma14551EncodedCertificate_realRowValid
          EOF
          lake env lean K19LegacySourceValidAxiomAudit.lean \
            2>&1 | tee ../logs/valid_axiom_audit.out
          if grep -q 'sorryAx' ../logs/valid_axiom_audit.out; then exit 6; fi
          if grep -nE '(^|[^[:alnum:]_])(sorry|admit)([^[:alnum:]_]|$)' \
              Erdos1135/KrasikovLagarias/Generated/K19Gamma14551*.lean; then
            exit 7
          fi
          printf '%s\n' \
            'K19_SOURCE_LEGACY_EIGHT_INTERVALS_AUTHENTICATED=PASS' \
            'K19_SOURCE_LEGACY_DEPENDENCY_HASHES=PASS' \
            'K19_SOURCE_LEGACY_INTERVAL_COMPOSITION=PASS' \
            'K19_SOURCE_LEGACY_VALID_AXIOM_AUDIT=PASS_NO_SORRYAX' \
            'K19_SOURCE_EXACT_VALID=PASS' \
            | tee ../logs/verdict.out

      - name: Package exact legacy source Valid boundary
        shell: bash
        run: |
          set -euxo pipefail
          BASE=source/.lake/build/lib/lean/Erdos1135/KrasikovLagarias
          GEN="$BASE/Generated"
          mkdir -p boundary/Erdos1135/KrasikovLagarias/Generated
          cp "$BASE/StreamingCertificate.olean" boundary/Erdos1135/KrasikovLagarias/
          cp "$BASE/ChunkedStreamingCertificate.olean" boundary/Erdos1135/KrasikovLagarias/
          cp "$GEN/K19Gamma14551Data.olean" boundary/Erdos1135/KrasikovLagarias/Generated/
          cp "$GEN"/K19Gamma14551Rows??.olean boundary/Erdos1135/KrasikovLagarias/Generated/
          cp "$GEN/K19Gamma14551.olean" boundary/Erdos1135/KrasikovLagarias/Generated/
          find boundary -type f -print0 | sort -z | xargs -0 sha256sum \
            | tee logs/boundary.sha256

      - name: Upload exact source Valid boundary and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k19-source-exact-valid-boundary-${{ github.run_id }}
          path: |
            boundary/
            logs/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
