name: v25-dual-defense-verify

on:
  push:
    branches: ["v25-dual-causal-defense-final"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - name: Run complete V24 plus V25 regression suite
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Stage verified V25 source handoff
        run: |
          mkdir -p artifact/V25_Dual_Causal_Defense
          rsync -a --exclude='.git' --exclude='.venv' --exclude='__pycache__' --exclude='.pytest_cache' --exclude='results' --exclude='v25_results' --exclude='runtime' ./ artifact/V25_Dual_Causal_Defense/
      - name: Upload single verified V25 ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: V25_Dual_Causal_Defense_Final
          path: artifact/V25_Dual_Causal_Defense
          if-no-files-found: error
          compression-level: 9
          retention-days: 30
